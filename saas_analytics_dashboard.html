<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulseboard | SaaS Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['DM Sans', 'ui-sans-serif', 'system-ui'] },
          colors: {
            ink: '#262331',
            mist: '#f7f5fb',
            mint: '#8b7cf6',
            coral: '#ff8067',
            dusk: '#777181'
          },
          boxShadow: {
            soft: '0 12px 35px rgba(23, 33, 31, 0.07)',
            'soft-dark': '0 12px 35px rgba(0, 0, 0, 0.2)'
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-is@18.3.1/umd/react-is.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.15.1/umd/Recharts.min.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js"></script>
  <style>
    :root { color-scheme: light; }
    html.dark { color-scheme: dark; }
    body { font-family: 'DM Sans', sans-serif; }
    .display { font-family: 'Space Grotesk', sans-serif; }
    .grid-paper { background-image: linear-gradient(rgba(139,124,246,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(139,124,246,.055) 1px, transparent 1px); background-size: 28px 28px; }
    .chart-tooltip { border: 1px solid rgba(148, 163, 184, .18); border-radius: 12px; padding: 10px 12px; background: rgba(255,255,255,.95); box-shadow: 0 10px 30px rgba(23,33,31,.12); }
    .dark .chart-tooltip { background: rgba(33,30,43,.97); }
    [class*="bg-[#e9f8f1]"] { background-color: #f0edff !important; }
    [class*="text-[#238e62]"] { color: #7567df !important; }
    aside [class*="dark:bg-[#173d2e]"] { background-color: #332d58 !important; }
    aside [class*="dark:text-[#72d8ac]"] { color: #c7bfff !important; }
    html:not(.dark) [class*="bg-[#192321]"] { background-color: #ffffff !important; }
    svg [stroke="#36c98f"] { stroke: #8b7cf6 !important; }
    svg [fill="#36c98f"] { fill: #8b7cf6 !important; }
    svg [stop-color="#36c98f"] { stop-color: #8b7cf6 !important; }
    @keyframes iconFloat { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-4px) rotate(3deg); } }
    @keyframes cardSheen { 0% { transform: translateX(-120%) rotate(12deg); opacity: 0; } 35%, 65% { opacity: .8; } 100% { transform: translateX(260%) rotate(12deg); opacity: 0; } }
    @keyframes softPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(139,124,246,.16); } 50% { box-shadow: 0 0 0 8px rgba(139,124,246,0); } }
    .metric-card-motion { position: relative; overflow: hidden; }
    .metric-card-motion::after { content: ''; position: absolute; top: -35%; left: -40%; width: 24%; height: 170%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.62), transparent); transform: translateX(-120%) rotate(12deg); pointer-events: none; }
    .metric-card-motion:hover::after { animation: cardSheen .9s ease-out; }
    .metric-card-motion:hover .metric-icon-motion { animation: iconFloat 1.2s ease-in-out infinite; }
    .metric-card-motion:first-child .metric-icon-motion { animation: softPulse 2.6s ease-in-out infinite; }
    .report-tab-active { box-shadow: inset 0 -2px 0 #8b7cf6; }
    @media (max-width: 767px) { .mobile-label { display: none; } }
  </style>
</head>
<body class="bg-mist text-ink antialiased transition-colors duration-300 dark:bg-[#17151f] dark:text-[#f1eef8]">
  <div id="root"></div>
  <script type="text/babel">
    const { useEffect, useState } = React;
    const { AreaChart, Area, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = Recharts;

    const navItems = [
      ['LayoutDashboard', 'Overview'], ['ChartNoAxesCombined', 'Analytics'], ['UsersRound', 'Customers'], ['CreditCard', 'Billing'], ['Goal', 'Targets']
    ];
    const metrics = [
      { label: 'MRR', value: '$48,320', change: '+12.5%', note: 'vs. last month', icon: 'WalletCards', color: 'violet' },
      { label: 'Active Users', value: '2,847', change: '+8.3%', note: 'vs. last month', icon: 'UsersRound', color: 'blue' },
      { label: 'Churn', value: '3.2%', change: '-0.5%', note: 'vs. last month', icon: 'UserMinus', color: 'coral' },
      { label: 'NPS Score', value: '72', change: '+3', note: 'vs. last month', icon: 'Sparkles', color: 'violet' }
    ];
    const revenue = [
      { month: 'Jan', revenue: 24, target: 21 }, { month: 'Feb', revenue: 28, target: 24 }, { month: 'Mar', revenue: 27, target: 27 },
      { month: 'Apr', revenue: 34, target: 29 }, { month: 'May', revenue: 32, target: 33 }, { month: 'Jun', revenue: 38, target: 35 },
      { month: 'Jul', revenue: 42, target: 38 }, { month: 'Aug', revenue: 48, target: 43 }, { month: 'Sep', revenue: 48, target: 46 }
    ];
    const signups = [
      { day: 'Mon', signups: 38 }, { day: 'Tue', signups: 52 }, { day: 'Wed', signups: 45 }, { day: 'Thu', signups: 68 },
      { day: 'Fri', signups: 56 }, { day: 'Sat', signups: 32 }, { day: 'Sun', signups: 41 }
    ];
    const activities = [
      ['Olivia Martin', 'Upgraded to Pro plan', '2 min ago', 'OM', 'bg-[#e8f7ee] text-[#259764]'],
      ['Noah Williams', 'Invited 4 team members', '18 min ago', 'NW', 'bg-[#eaf1ff] text-[#4d78c9]'],
      ['Ava Anderson', 'Completed onboarding', '42 min ago', 'AA', 'bg-[#fff0e8] text-[#d46d4d]'],
      ['Liam Thompson', 'Added a new workspace', '1 hr ago', 'LT', 'bg-[#f1ecff] text-[#8a67d1]']
    ];
    const icon = (name, size=18) => {
      const iconName = name.replace(/[A-Z]/g, letter => `-${letter.toLowerCase()}`).replace(/^-/, '');
      return <i data-lucide={iconName} width={size} height={size} strokeWidth="1.8"></i>;
    };

    function IconButton({ label, children, onClick }) {
      return <button aria-label={label} title={label} onClick={onClick} className="grid h-10 w-10 place-items-center rounded-xl border border-slate-200/80 bg-white text-slate-500 transition hover:border-mint hover:text-mint dark:border-white/10 dark:bg-white/[.04] dark:text-slate-300">{children}</button>;
    }
    function MetricCard({ metric }) {
      const tones = { mint: 'bg-[#f0edff] text-[#7567df] dark:bg-[#332d58]', blue: 'bg-[#e9f1ff] text-[#4d78c9] dark:bg-[#1c2d4e]', coral: 'bg-[#fff0ea] text-[#dd7159] dark:bg-[#492a25]', violet: 'bg-[#f0edff] text-[#7567df] dark:bg-[#332d58]' };
      return <article className="metric-card-motion rounded-2xl border border-slate-200/80 bg-white p-5 shadow-soft transition duration-300 hover:-translate-y-1 hover:shadow-lg dark:border-white/10 dark:bg-[#192321] dark:shadow-soft-dark">
        <div className="flex items-start justify-between"><div><p className="text-sm font-medium text-dusk dark:text-slate-400">{metric.label}</p><p className="display mt-2 text-[27px] font-semibold tracking-[-.04em]">{metric.value}</p></div><div className={`metric-icon-motion grid h-10 w-10 place-items-center rounded-xl ${tones[metric.color]}`}>{icon(metric.icon, 19)}</div></div>
        <div className="mt-5 flex items-center gap-2 text-xs"><span className="rounded-full bg-[#e7f8ef] px-2 py-1 font-semibold text-[#249766] dark:bg-[#173d2e] dark:text-[#67d5a5]">{metric.change}</span><span className="text-dusk dark:text-slate-500">{metric.note}</span></div>
      </article>;
    }
    function ChartTip({ active, payload, label }) {
      if (!active || !payload?.length) return null;
      return <div className="chart-tooltip"><p className="mb-1 text-xs text-slate-400">{label}</p><p className="font-semibold text-ink dark:text-white">${payload[0].value}k revenue</p></div>;
    }
    const mockReportData = {
      activity: [{ day: 'Aug 1', events: 420 }, { day: 'Aug 3', events: 610 }, { day: 'Aug 5', events: 530 }, { day: 'Aug 7', events: 780 }, { day: 'Aug 9', events: 690 }, { day: 'Aug 11', events: 910 }],
      audience: [{ label: 'Power users', value: 38, color: '#8b7cf6' }, { label: 'Regular users', value: 31, color: '#b69cf5' }, { label: 'New users', value: 22, color: '#d58be8' }, { label: 'At risk', value: 9, color: '#e6dff0' }],
      retention: [{ label: 'Week 1', values: [100, 94, 88, 81] }, { label: 'Week 2', values: [86, 77, 64, 55] }, { label: 'Week 3', values: [74, 62, 48, 39] }, { label: 'Week 4', values: [68, 51, 37, 28] }]
    };
    function ReportSectionPreview({ activeTab, dark }) {
      const shell = 'rounded-2xl border border-slate-200/80 bg-white p-5 shadow-soft dark:border-white/10 dark:bg-[#192321] dark:shadow-soft-dark';
      const heading = { '01 Overview': ['Overview snapshot', 'A compact read on the selected reporting window.'], '02 Activity & usage': ['Activity & usage', 'How frequently people return and what they do.'], '03 Audience': ['Audience composition', 'Who is active across the selected use case and department.'], '04 Retention & lifecycle': ['Retention & lifecycle', 'Cohort movement from first use to repeat value.'], '05 Access & journeys': ['Access & journeys', 'Where users enter, move through, and exit the product.'], '06 Insight evidence': ['Insight evidence', 'Signals with the strongest supporting evidence.'], '07 Data coverage': ['Data coverage', 'Source freshness and completeness for this report.'] }[activeTab];
      const title = <div className="flex flex-col justify-between gap-2 sm:flex-row sm:items-start"><div><div className="flex items-center gap-2"><span className="text-xs font-bold uppercase tracking-[.15em] text-mint">{activeTab}</span><span className="h-1 w-1 rounded-full bg-slate-300"></span><span className="text-xs text-dusk dark:text-slate-500">Mock section</span></div><h2 className="display mt-2 text-[20px] font-semibold tracking-[-.04em]">{heading[0]}</h2><p className="mt-1 text-sm text-dusk dark:text-slate-400">{heading[1]}</p></div><span className="inline-flex items-center gap-1.5 self-start rounded-full bg-[#f0edff] px-2.5 py-1 text-[11px] font-semibold text-[#7567df] dark:bg-[#332d58] dark:text-[#c7bfff]">{icon('Sparkles', 13)} Preview data</span></div>;
      if (activeTab === '01 Overview') return <section className="mt-6 grid gap-4 lg:grid-cols-[1.4fr_1fr]"> <article className={shell}>{title}<div className="mt-6 grid gap-3 sm:grid-cols-3"><div className="rounded-xl bg-[#f8f6ff] p-4 dark:bg-white/[.04]"><p className="text-xs text-dusk dark:text-slate-400">Total sessions</p><p className="display mt-2 text-2xl font-semibold">18,492</p><p className="mt-1 text-xs font-semibold text-[#249766]">+16.8% vs prior</p></div><div className="rounded-xl bg-[#f8f6ff] p-4 dark:bg-white/[.04]"><p className="text-xs text-dusk dark:text-slate-400">Activation rate</p><p className="display mt-2 text-2xl font-semibold">64.7%</p><p className="mt-1 text-xs font-semibold text-[#249766]">+4.2 pts</p></div><div className="rounded-xl bg-[#f8f6ff] p-4 dark:bg-white/[.04]"><p className="text-xs text-dusk dark:text-slate-400">Qualified events</p><p className="display mt-2 text-2xl font-semibold">8,931</p><p className="mt-1 text-xs font-semibold text-[#249766]">+11.4%</p></div></div></article><article className={shell}>{title}<div className="mt-6 space-y-4"><div><div className="mb-1 flex justify-between text-xs"><span>Goal progress</span><b>82%</b></div><div className="h-2 rounded-full bg-[#eeeaf8]"><div className="h-full w-[82%] rounded-full bg-mint"></div></div></div><div><div className="mb-1 flex justify-between text-xs"><span>Data confidence</span><b>96%</b></div><div className="h-2 rounded-full bg-[#eeeaf8]"><div className="h-full w-[96%] rounded-full bg-[#b69cf5]"></div></div></div><p className="rounded-xl border border-[#e8e2fa] bg-[#fbfaff] p-3 text-xs leading-5 text-dusk dark:border-white/10 dark:bg-white/[.03] dark:text-slate-400">The selected window shows stronger activation and steady repeat usage across the core audience.</p></div></article></section>;
      if (activeTab === '02 Activity & usage') return <section className={`${shell} mt-6`}>{title}<div className="mt-5 h-[240px]"><ResponsiveContainer width="100%" height="100%"><BarChart data={mockReportData.activity} margin={{ top: 8, right: 8, left: -22, bottom: 0 }}><CartesianGrid strokeDasharray="3 5" vertical={false} stroke={dark ? '#393348' : '#eeeaf5'} /><XAxis dataKey="day" axisLine={false} tickLine={false} tick={{ fontSize: 11, fill: dark ? '#aaa2b8' : '#918b9a' }} /><YAxis axisLine={false} tickLine={false} tick={{ fontSize: 11, fill: dark ? '#aaa2b8' : '#918b9a' }} /><Tooltip /><Bar dataKey="events" fill="#8b7cf6" radius={[6, 6, 0, 0]} barSize={32} /></BarChart></ResponsiveContainer></div></section>;
      if (activeTab === '03 Audience') return <section className={`${shell} mt-6`}>{title}<div className="mt-6 grid gap-5 md:grid-cols-2">{mockReportData.audience.map(item => <div key={item.label}><div className="mb-2 flex items-center justify-between text-sm"><span className="flex items-center gap-2"><i className="h-2.5 w-2.5 rounded-full" style={{ background: item.color }}></i>{item.label}</span><b>{item.value}%</b></div><div className="h-3 rounded-full bg-[#f0edf6] dark:bg-white/[.06]"><div className="h-full rounded-full" style={{ width: `${item.value}%`, background: item.color }}></div></div></div>)}</div></section>;
      if (activeTab === '04 Retention & lifecycle') return <section className={`${shell} mt-6`}>{title}<div className="mt-6 overflow-x-auto"><div className="min-w-[560px]"><div className="grid grid-cols-5 gap-2 text-xs font-semibold text-dusk dark:text-slate-400"><span>Cohort</span><span>Day 1</span><span>Day 7</span><span>Day 14</span><span>Day 30</span></div><div className="mt-2 space-y-2">{mockReportData.retention.map(row => <div key={row.label} className="grid grid-cols-5 gap-2 text-xs"><span className="py-3 font-semibold">{row.label}</span>{row.values.map((value, index) => <span key={index} className="rounded-lg py-3 text-center font-semibold" style={{ background: `rgba(139,124,246,${Math.max(.1, value / 120)})`, color: value > 70 ? '#5546b8' : '#7567df' }}>{value}%</span>)}</div>)}</div></div></div></section>;
      if (activeTab === '05 Access & journeys') return <section className={`${shell} mt-6`}>{title}<div className="mt-6 grid gap-2 md:grid-cols-4">{[['Landing', '4,820', '100%'], ['Activated', '3,114', '64.6%'], ['Returned', '1,842', '38.2%'], ['Converted', '694', '14.4%']].map(([label, value, rate], index) => <div key={label} className="relative"><div className="rounded-xl border border-[#e9e4f4] bg-[#fbfaff] p-4 dark:border-white/10 dark:bg-white/[.03]" style={{ marginTop: `${index * 8}px` }}><p className="text-xs text-dusk dark:text-slate-400">{label}</p><p className="display mt-2 text-xl font-semibold">{value}</p><p className="mt-1 text-xs font-semibold text-[#7567df]">{rate} of entry</p></div>{index < 3 && <div className="absolute -right-2 top-1/2 hidden text-[#b8afff] md:block">{icon('ChevronRight', 15)}</div>}</div>)}</div></section>;
      if (activeTab === '06 Insight evidence') return <section className={`${shell} mt-6`}>{title}<div className="mt-5 grid gap-3 md:grid-cols-3">{[['Activation is rising', '+4.2 pts', 'Strong', 'ArrowUpRight'], ['Power users return more often', '2.4×', 'Medium', 'Repeat2'], ['Billing flow has friction', '−18%', 'Watch', 'TriangleAlert']].map(([label, value, confidence, insightIcon]) => <article key={label} className="rounded-xl border border-slate-100 bg-[#fcfbfe] p-4 dark:border-white/10 dark:bg-white/[.03]"><div className="flex items-center justify-between"><span className="grid h-8 w-8 place-items-center rounded-lg bg-[#f0edff] text-[#7567df] dark:bg-[#332d58] dark:text-[#c7bfff]">{icon(insightIcon, 16)}</span><span className="text-[10px] font-bold uppercase tracking-wide text-[#7567df]">{confidence}</span></div><p className="mt-4 text-sm font-semibold">{label}</p><p className="display mt-2 text-2xl font-semibold">{value}</p><p className="mt-1 text-xs text-dusk dark:text-slate-400">Based on 3 supporting signals</p></article>)}</div></section>;
      return <section className={`${shell} mt-6`}>{title}<div className="mt-5 overflow-x-auto"><table className="w-full min-w-[560px] text-left text-sm"><thead className="text-[11px] uppercase tracking-[.1em] text-slate-400"><tr><th className="pb-3">Source</th><th className="pb-3">Last synced</th><th className="pb-3">Rows</th><th className="pb-3">Coverage</th><th className="pb-3">Status</th></tr></thead><tbody className="divide-y divide-slate-100 dark:divide-white/10">{[['Product events', '11 Aug, 09:42', '18,492', '100%', 'Healthy'], ['Workspace members', '11 Aug, 09:38', '2,847', '98.4%', 'Healthy'], ['Billing records', '11 Aug, 08:55', '6,204', '91.2%', 'Review']].map(row => <tr key={row[0]}><td className="py-3 font-semibold">{row[0]}</td><td className="py-3 text-dusk dark:text-slate-400">{row[1]}</td><td className="py-3">{row[2]}</td><td className="py-3">{row[3]}</td><td className="py-3"><span className={`rounded-full px-2 py-1 text-[11px] font-semibold ${row[4] === 'Healthy' ? 'bg-[#e7f8ef] text-[#249766]' : 'bg-[#fff5dc] text-[#9d771f]'}`}>{row[4]}</span></td></tr>)}</tbody></table></div></section>;
    }
    function TemplateChart({ template, style, dark }) {
      const chartData = template.data;
      const common = { margin: { top: 8, right: 8, left: -22, bottom: 0 } };
      if (style === 'donut' || template.id === 'audience') return <ResponsiveContainer width="100%" height="100%"><PieChart><Pie data={template.data} dataKey="value" nameKey="name" cx="50%" cy="50%" innerRadius="54%" outerRadius="78%" paddingAngle={3} stroke="none">{template.data.map((entry, index) => <Cell key={entry.name} fill={['#8b7cf6', '#b69cf5', '#d58be8', '#e7d9f3'][index % 4]} />)}</Pie><Tooltip contentStyle={{ borderRadius: 12, border: '1px solid #e4e9e6', fontSize: 12 }} /></PieChart></ResponsiveContainer>;
      if (style === 'bar') return <ResponsiveContainer width="100%" height="100%"><BarChart data={chartData} {...common}><CartesianGrid strokeDasharray="3 5" vertical={false} stroke={dark ? '#393348' : '#eeeaf5'} /><XAxis dataKey={template.id === 'signups' ? 'day' : 'month'} axisLine={false} tickLine={false} tick={{ fontSize: 11, fill: dark ? '#aaa2b8' : '#918b9a' }} dy={10} /><YAxis axisLine={false} tickLine={false} tick={{ fontSize: 11, fill: dark ? '#aaa2b8' : '#918b9a' }} /><Tooltip content={<ChartTip />} /><Bar dataKey={template.valueKey} fill={template.color} radius={[6, 6, 0, 0]} barSize={22} /></BarChart></ResponsiveContainer>;
      if (style === 'line') return <ResponsiveContainer width="100%" height="100%"><LineChart data={chartData} {...common}><CartesianGrid strokeDasharray="3 5" vertical={false} stroke={dark ? '#393348' : '#eeeaf5'} /><XAxis dataKey={template.id === 'signups' ? 'day' : 'month'} axisLine={false} tickLine={false} tick={{ fontSize: 11, fill: dark ? '#aaa2b8' : '#918b9a' }} dy={10} /><YAxis axisLine={false} tickLine={false} tick={{ fontSize: 11, fill: dark ? '#aaa2b8' : '#918b9a' }} /><Tooltip content={<ChartTip />} /><Line type="monotone" dataKey={template.valueKey} stroke={template.color} strokeWidth={3} dot={{ r: 3, fill: template.color, strokeWidth: 0 }} activeDot={{ r: 6 }} /></LineChart></ResponsiveContainer>;
      return <ResponsiveContainer width="100%" height="100%"><AreaChart data={chartData} {...common}><defs><linearGradient id={`template-${template.id}`} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={template.color} stopOpacity=".3"/><stop offset="100%" stopColor={template.color} stopOpacity=".03"/></linearGradient></defs><CartesianGrid strokeDasharray="3 5" vertical={false} stroke={dark ? '#393348' : '#eeeaf5'} /><XAxis dataKey={template.id === 'signups' ? 'day' : 'month'} axisLine={false} tickLine={false} tick={{ fontSize: 11, fill: dark ? '#aaa2b8' : '#918b9a' }} dy={10} /><YAxis axisLine={false} tickLine={false} tick={{ fontSize: 11, fill: dark ? '#aaa2b8' : '#918b9a' }} /><Tooltip content={<ChartTip />} /><Area type="monotone" dataKey={template.valueKey} stroke={template.color} strokeWidth={2.5} fill={`url(#template-${template.id})`} activeDot={{ r: 5, fill: template.color, stroke: '#fff', strokeWidth: 3 }} /></AreaChart></ResponsiveContainer>;
    }
    function TemplateStudio({ templateId, setTemplateId, style, setStyle, dark }) {
      const template = chartTemplates.find(item => item.id === templateId) || chartTemplates[0];
